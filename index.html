<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Words Length Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="card">
        <h1>Words Length Calculator</h1>
        <h2>Type a sentence</h2>
        <textarea id="sentence" name="Length_Calculator" placeholder="Type Here..." cols="30" rows="15"></textarea>
        <button type="button" id="button" onclick="calculate()">Calculate Words</button>
        <p id="result"></p>
        </main>
        <script src="script.js"></script>
    </body>
</html>
